version: 0.0
os: linux
files:
  - source: /index.html
    destination: /var/www/html/
  - source: /products.html
    destination: /var/www/html/
  - source: /cart.html
    destination: /var/www/html/
  - source: /style.css
    destination: /var/www/html/
  - source: /script.js
    destination: /var/www/html/

hooks:
  BeforeInstall:
    - location: script/dep.sh
      timeout: 300
      runas: root
 
