
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Amazon Style Store</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">amazon<span>.in</span></a>

    <div class="delivery">
      <small>Deliver to</small>
      <strong>India</strong>
    </div>

    <form class="search" action="products.html">
      <input type="search" name="q" placeholder="Search Amazon products">
      <button aria-label="Search">🔍</button>
    </form>

    <a href="products.html" class="nav-link">Products</a>
    <a href="cart.html" class="nav-link">🛒 Cart (<span class="cart-count">0</span>)</a>
  </header>

  <nav class="subnav">
    <a href="index.html">Home</a>
    <a href="products.html">All Products</a>
    <a href="products.html?category=Electronics">Electronics</a>
    <a href="products.html?category=Fashion">Fashion</a>
    <a href="products.html?category=Home">Home & Kitchen</a>
    <a href="products.html?category=Books">Books</a>
  </nav>

  <main class="section">
    <div class="section-heading">
      <h1>Explore Products</h1>
      <span id="result-count"></span>
    </div>

    <div class="filters">
      <label for="category-filter">Category:</label>
      <select id="category-filter">
        <option value="All">All Categories</option>
        <option value="Electronics">Electronics</option>
        <option value="Fashion">Fashion</option>
        <option value="Home">Home & Kitchen</option>
        <option value="Books">Books</option>
      </select>

      <label for="sort-filter">Sort by:</label>
      <select id="sort-filter">
        <option value="default">Featured</option>
        <option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option>
        <option value="rating">Customer Rating</option>
      </select>
    </div>

    <div id="all-products" class="product-grid"></div>
    <p id="empty-message" class="empty-message" hidden>
      No products found. Try another search.
    </p>
  </main>

  <footer>
    <a href="index.html">← Back to home</a>
    <p>Demo shopping website for educational purposes.</p>
  </footer>
</body>
</html>
